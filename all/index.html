                } else if (fwVal >= 1000 && fwVal <= 1102) {
                    var script = document.createElement('script');

                    script.onerror = onScriptError;
                    script.onload = function () {
                        setTimeout(function () {
                            doJb();

                    document.head.appendChild(script);
                } else if (fwVal >= 1150 && fwVal <= 1202) {
                    var script = document.createElement('script');
                    script.type = 'module';
                    script.src = "slopkit/chain_lapse.js";

<script>
(function() {
    var logBox = document.getElementById('log-box');
    var statusBadge = document.getElementById('status-badge');
    var statusDot = document.getElementById('status-dot');
    var spinner = document.getElementById('main-spinner');
    var msgsEl = document.getElementById('msgs');
    var recoveryBox = document.getElementById('recovery-box');
    var recoveryText = document.getElementById('recovery-text');
    var stepEnv = document.getElementById('step-env');
    var stepMem = document.getElementById('step-mem');
    var stepTrigger = document.getElementById('step-trigger');
    var stepDone = document.getElementById('step-done');
    var conn1 = document.getElementById('conn-1');
    var conn2 = document.getElementById('conn-2');
    var conn3 = document.getElementById('conn-3');
    var lastLogged = '';

    function setStep(stage, isError) {
        if (!stepEnv) return;
        stepEnv.className = 'stage-step';
        stepMem.className = 'stage-step';
        stepTrigger.className = 'stage-step';
        stepDone.className = 'stage-step';
        if (conn1) conn1.className = 'step-connector';
        if (conn2) conn2.className = 'step-connector';
        if (conn3) conn3.className = 'step-connector';

        if (stage === 1) {
            stepEnv.className = 'stage-step active' + (isError ? ' error' : '');
        } else if (stage === 2) {
            stepEnv.className = 'stage-step done';
            if (conn1) conn1.className = 'step-connector done';
            stepMem.className = 'stage-step active' + (isError ? ' error' : '');
        } else if (stage === 3) {
            stepEnv.className = 'stage-step done';
            if (conn1) conn1.className = 'step-connector done';
            stepMem.className = 'stage-step done';
            if (conn2) conn2.className = 'step-connector done';
            stepTrigger.className = 'stage-step active' + (isError ? ' error' : '');
        } else if (stage === 4) {
            stepEnv.className = 'stage-step done';
            if (conn1) conn1.className = 'step-connector done';
            stepMem.className = 'stage-step done';
            if (conn2) conn2.className = 'step-connector done';
            stepTrigger.className = 'stage-step done';
            if (conn3) conn3.className = 'step-connector done';
            stepDone.className = 'stage-step done';
        }
    }

    function appendLog(text, type) {
        if (!logBox || !text || text === lastLogged) return;
        lastLogged = text;
        var cleanText = String(text).replace(/<[^>]*>/g, '').trim();
        if (!cleanText) return;

        var line = document.createElement('div');
        var tag = type || 'INFO';
        if (!type) {
            if (cleanText.indexOf('Loading') !== -1 || cleanText.indexOf('Installing') !== -1) tag = 'LOAD';
            else if (cleanText.indexOf('Loaded') !== -1 || cleanText.indexOf('Pass') !== -1 || cleanText.indexOf('Success') !== -1) tag = 'PASS';
            else if (cleanText.indexOf('Fail') !== -1 || cleanText.indexOf('Error') !== -1 || cleanText.indexOf('Unsupported') !== -1 || cleanText.indexOf('not Found') !== -1 || cleanText.indexOf('Only for PS4') !== -1) tag = 'FAIL';
        }
        line.className = 'log-line log-' + tag.toLowerCase();
        line.innerHTML = '<span class="log-tag log-tag-' + tag.toLowerCase() + '">[' + tag + ']</span> ' + cleanText;
        logBox.appendChild(line);
        logBox.scrollTop = logBox.scrollHeight;

        if (tag === 'PASS') {
            setStep(4, false);
            if (statusBadge) {
                statusBadge.textContent = 'EXPLOIT STATUS: COMPLETE';
                statusBadge.className = 'status-badge status-success';
            }
            if (statusDot) statusDot.className = 'status-dot success';
            if (spinner) spinner.className = 'loader-spinner complete';
            if (recoveryBox) recoveryBox.style.display = 'none';
        } else if (tag === 'FAIL') {
            if (cleanText.indexOf('Only for PS4') !== -1 || cleanText.indexOf('Unsupported') !== -1) {
                setStep(1, true);
            } else {
                setStep(3, true);
            }
            if (statusBadge) {
                statusBadge.textContent = 'EXPLOIT STATUS: FAILED';
                statusBadge.className = 'status-badge status-error';
            }
            if (statusDot) statusDot.className = 'status-dot error';
            if (spinner) spinner.className = 'loader-spinner paused';
            if (recoveryBox) {
                recoveryBox.style.display = 'block';
                if (recoveryText) {
                    if (cleanText.indexOf('not Found') !== -1 || cleanText.indexOf('Installing Cache') !== -1) {
                        recoveryText.textContent = 'Cache installation failed or files are missing. Reconnect Wi-Fi and re-install cache.';
                    } else if (cleanText.indexOf('Only for PS4') !== -1 || cleanText.indexOf('Unsupported') !== -1) {
                        recoveryText.textContent = 'This host requires a compatible PlayStation 4 browser (FW 5.05 - 14.00).';
                    } else {
                        recoveryText.textContent = 'Exploit desynchronized. For best stability: Press PS Button > Press Options > Close Window, then re-open browser to prevent kernel panic.';
                    }
                }
            }
        } else {
            if (cleanText.indexOf('Loading GoldHEN') !== -1) {
                setStep(2, false);
            } else if (cleanText.indexOf('Jailbreak') !== -1 || cleanText.indexOf('payload') !== -1) {
                setStep(3, false);
            } else {
                setStep(2, false);
            }
            if (statusBadge) {
                statusBadge.textContent = 'EXPLOIT STATUS: IN PROGRESS';
                statusBadge.className = 'status-badge status-active';
            }
            if (statusDot) statusDot.className = 'status-dot active';
            if (recoveryBox) recoveryBox.style.display = 'none';
        }
    }

    if (msgsEl) {
        var initialText = msgsEl.innerText || msgsEl.textContent;
        if (initialText) appendLog(initialText);

        var MutationObs = window.MutationObserver || window.WebKitMutationObserver;
        if (MutationObs) {
            var obs = new MutationObs(function() {
                var txt = msgsEl.innerText || msgsEl.textContent;
                appendLog(txt);
            });
            obs.observe(msgsEl, { childList: true, subtree: true, characterData: true });
        }
    }

    window.logEvent = function(msg, type) { appendLog(msg, type); };
    window.print = function(msg) { appendLog(typeof msg === 'object' ? JSON.stringify(msg) : String(msg)); };
})();
</script>
